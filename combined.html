    --page:#000}
  :root[data-theme="light"]{color-scheme:light;--grad:linear-gradient(135deg,#3b82f6,#8b5cf6);--on-grad:#fff;--glow:rgba(99,102,241,.4);--glow2:rgba(99,102,241,.5);--bg:#f1f5f9;--card:rgba(255,255,255,.78);--text:#0f172a;--muted:rgba(15,23,42,.62);--accent:#2563eb;--accent-soft:rgba(37,99,235,.12);--border:rgba(15,23,42,.16);--ok:#15803d;
    --accent2:#2563eb;--ring:rgba(37,99,235,.25);--field:rgba(255,255,255,.9);--ph:rgba(15,23,42,.4);--soft:rgba(15,23,42,.05);--soft-hover:rgba(15,23,42,.10);--out-bg:rgba(255,255,255,.7);--out-border:rgba(15,23,42,.28);--hist-border:rgba(15,23,42,.12);--shadow:0 10px 30px rgba(15,23,42,.10);

  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);padding:16px}
  .wrap{max-width:900px;margin:0 auto}
  h1{font-size:20px;margin:0 0 12px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px}

  input[type=text],input[type=time],select{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:15px}

  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;max-height:200px;overflow-y:auto}

  .chip.sel,.ev.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
  .ev{border-radius:8px;text-align:left;font-family:inherit;font-size:13px;padding:6px 12px}
  .tabs{display:flex;gap:6px;margin-bottom:10px}
  .tab{flex:1;padding:9px;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:8px;cursor:pointer;font-size:14px}
  .tab.sel{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
  .evs{display:flex;flex-wrap:wrap;gap:6px}
  .out{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;padding:10px;border:1px dashed var(--border);border-radius:8px;min-height:42px;word-break:break-word}

  button.sec{padding:10px 16px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;cursor:pointer}
  .hist div{padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;cursor:pointer;word-break:break-word}

  .toast{color:var(--ok);font-size:13px;height:18px}
  .chk{display:flex;align-items:center;gap:6px;font-size:14px;flex:0 0 auto}
  .prop{font-size:13px;color:var(--muted);margin-top:6px;min-height:18px}

  #lock .box{width:100%;max-width:360px;text-align:center;padding:32px 26px 26px;border-radius:20px;color:#fff;
    background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);
    -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 20px 60px rgba(0,0,0,.45);animation:rise .5s ease both}
  #lock .icon{width:64px;height:64px;margin:0 auto 16px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#60a5fa,#8b5cf6);box-shadow:0 8px 24px rgba(96,165,250,.45)}

  #lock .err{color:#fca5a5;font-size:13px;height:18px;margin:10px 0 4px}
  #lock .go{width:100%;padding:13px;border:0;border-radius:12px;font-size:15px;font-weight:600;color:#fff;cursor:pointer;
    background:linear-gradient(135deg,#3b82f6,#8b5cf6);box-shadow:0 8px 20px rgba(99,102,241,.4);transition:transform .15s,box-shadow .15s}

  #lock .foot{margin-top:16px;font-size:11px;color:rgba(255,255,255,.5)}

(function(){
  const H = 6159867595082519;
  const hash=(str,seed=0)=>{let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0);};
  const lock=document.getElementById("lock"), pw=document.getElementById("pw"), err=document.getElementById("pwErr");
  function tryUnlock(){
    if(hash(pw.value)===H){ document.body.classList.remove("locked"); lock.style.display="none"; pw.value=""; err.textContent=""; }
    else { err.textContent="Wrong password"; pw.value=""; pw.focus(); const bx=document.getElementById("lockBox"); bx.classList.remove("shake"); void bx.offsetWidth; bx.classList.add("shake"); }
  }
  document.getElementById("pwBtn").onclick=tryUnlock;
  document.getElementById("eye").onclick=()=>{ pw.type = pw.type==="password" ? "text" : "password"; pw.focus(); };
  pw.addEventListener("keydown",e=>{ if(e.key==="Enter") tryUnlock(); });
  document.getElementById("lockBtn").onclick=()=>{ document.body.classList.add("locked"); lock.style.display="flex"; pw.focus(); };
  pw.focus();
})();

let timeFmt = "12", tab = Object.keys(EVENTS)[0], ev = "", history = [], siteFilter = "";

// Clean pasted text into a list of unique tags
const TIME_RE = /(\d{1,2}):(\d{2})(?:\s*([AP])\.?M\.?)?/i;
const DATE_RE = /(?:(?:Mon|Tues|Wednes|Thurs|Fri|Satur|Sun)day|Today|Yesterday)\b,?\s*(?:[A-Za-z]+\.?\s+\d{1,2}(?:st|nd|rd|th)?(?:,\s*\d{4})?,?\s*)?/ig;
function stripStamp(text){
  return text.replace(DATE_RE," ").replace(TIME_RE," ").replace(/[•·|]+/g," ");
}
function findTime(text){
  const m = text.match(TIME_RE); if(!m) return null;
  let h = Number(m[1]);
  if(m[3]){ h = h % 12; if(m[3].toUpperCase()==="P") h += 12; }
  return { v: String(h).padStart(2,"0") + ":" + m[2], fmt: m[3] ? "12" : "24" };
}
function parseTags(text){
  const t = stripStamp(text).replace(/\.(?=[A-Z])/g,"").replace(/(\d{5,6})(?=[A-Z])/g,"$1 ");
  const out = [];
  t.split(/[\/\s,;|]+/).forEach(x=>{ x = x.trim(); if(x && !out.includes(x)) out.push(x); });
  return out;
}
function prefixOf(tag){
  const m = tag.match(/^([A-Z]+?)(?:EXT|INT)/);
  if(!m) return null;
  return m[1];
}
function siteOf(tag){
  const p = prefixOf(tag); if(!p) return null;
  if(p==="RDP"){ const c = tag[3]; return SITES["RDP"+c] ? "RDP"+c : null; }
  if(p==="APP"){ const c = tag[3]; return SITES["APP"+c] ? "APP"+c : null; }
  if(p==="RDPE"||p==="RDPW"||p==="RDPN") return p;
  return SITES[p] ? p : null;
}
const PLAIN_TAGS = { side1:"WVR", side2:"WVR", front:"WVR" };
function siteOfAny(tag){
  if(PLAIN_TAGS[tag.toLowerCase()]) return PLAIN_TAGS[tag.toLowerCase()];
  // RDPEEXT... -> prefix regex gives "RDPE"; APPAEXT -> "APPA"
  const p = prefixOf(tag);
  if(p==="GLM" && tag.endsWith("000463")) return "ELT";
  if(p==="GLM") return tag.includes("LBBYB") ? "GLMB" : "GLMA";
  return p && SITES[p] ? p : null;
}
function tagString(){ return parseTags($("cam").value).join("/"); }

function renderProp(){
  const props = [];
  parseTags($("cam").value).forEach(t=>{
    const k = siteOfAny(t); if(k && !props.includes(SITES[k])) props.push(SITES[k]);
  });
  $("prop").textContent = props.length ? "Property: " + props.join(", ") : "";
}
function renderTabs(){

    $("tabs").appendChild(b);
  });
}
function renderEvs(){
  $("evs").innerHTML = "";
  EVENTS[tab].forEach(e=>{
    const b = document.createElement("button");
    b.className = "ev" + (e===ev?" sel":"");
    b.textContent = e.replace(/ @$/,"");
    b.onclick = () => { ev = e; renderEvs(); update(true); };
    $("evs").appendChild(b);
  });
}
function fmtTime(v){
  let h,m;
  if(v){ [h,m] = v.split(":").map(Number); }
  else { const d = new Date(); h = d.getHours(); m = d.getMinutes(); }
  if(timeFmt==="24") return String(h).padStart(2,"0") + ":" + String(m).padStart(2,"0");
  const ap = h>=12 ? "PM" : "AM";
  h = h%12 || 12;
  return h + ":" + String(m).padStart(2,"0") + ap;
}
function line(){
  if(!ev) return "";
  const tags = parseTags($("cam").value);
  const groups = [];
  tags.forEach(t=>{
    const k = siteOfAny(t);
    let g = groups.find(x=>x.k===k);
    if(!g){ g = {k, tags:[]}; groups.push(g); }
    g.tags.push(t);
  });
  let head;
  if(groups.length && groups.every(g=>g.k)){
    head = groups.map(g=>g.tags.join("/") + "-" + SITES[g.k] + "-" + ADDR[g.k]).join(" / ");
  } else if(groups.length){
    // some tags unknown: keep what was pasted, add property if the dropdown is set
    head = tags.join("/");
    if(siteFilter) head += "-" + SITES[siteFilter] + "-" + ADDR[siteFilter];
  } else if(siteFilter){
    head = SITES[siteFilter] + "-" + ADDR[siteFilter];
  } else head = "";
  const body = ev.replace(/ @$/,"");

}
function update(fromClick){

}
async function copyText(s){

    t.select(); document.execCommand("copy"); t.remove();
  }
  $("toast").textContent = "Copied ✓"; setTimeout(()=>$("toast").textContent="",1500);
}
async function doCopy(){

}
function renderHist(){

  });
}
let timeFromPaste = false;
function syncPasted(){

}

aff: $(\"d-staff\").value.trim(), emp: $(\"d-emp\").value, doc: $(\"d-doc\").value, codes: $(\"d-codes\").value.trim(),\n           act: r.act, bname: r.bname, baddr: r.baddr, tag: r.tag, notes: r.notes };\n}\nfunction check(r){\n  if (!formBase()) return \"Add the form link in Settings.\";\n  if (FIELDS.some(([k]) => !$(\"id-\" + k).value.trim())) { $(\"cfg\").open = true; return \"Fill all 10 entry IDs in Settings first.\"; }\n  if (!r.bname || !r.baddr) return \"Building name or address does not match the form list.\";\n  if (!r.tag || !r.notes) return \"Camera Tag or Notes is empty.\";\n  return \"\";\n}\n\n$(\"open\").addEventListener(\"click\", () => {\n  const r = records()[0], st = $(\"status\");\n  if (!r) { st.className = \"bad\"; st.textContent = \"Paste a line first.\"; return; }\n  const err = check(r);\n  if (err) { st.className = \"bad\"; st.textContent = err; return; }\n  const v = valuesFor(r), p = new URLSearchParams({ usp: \"pp_url\" });\n  FIELDS.forEach(([k]) => p.set($(\"id-\" + k).value.trim(), v[k]));\n  window.open(formBase() + \"/viewform?\" + p.toString(), \"_blank\");\n  const rest = logLines().slice(1);\n  $(\"lines\").value = rest.join(\"\\n\");\n  st.className = \"ok\"; st.textContent = \"Form opened.\";\n  render();\n});\n\n$(\"grab\").addEventListener(\"click\", () => {\n  const msg = $(\"grabmsg\");\n  const ids = ($(\"pplink\").value.match(/entry\\.\\d+(?==)/g) || []).filter((v, i, a) => a.indexOf(v) === i);\n  if (ids.length !== FIELDS.length) { msg.className = \"note bad\"; msg.textContent = \"Found \" + ids.length + \" IDs, need 10. Fill all 10 fields in the pre-filled link and try again.\"; return; }\n  FIELDS.forEach(([k], i) => { $(\"id-\" + k).value = ids[i]; });\n  msg.className = \"note ok\"; msg.textContent = \"Done. 10 IDs filled in form order: CRO Name, Staff, Emp ID, Doc, Codes, Activity type, Building Name, Address, Camera Tag, Notes.\";\n  save(); render();\n});\n\nconst SAVE = [\"formurl\",\"d-cro\",\"d-emp\",\"d-staff\",\"d-doc\",\"d-codes\",\"d-act\"].concat(FIELDS.map(([k]) => \"id-\" + k));\nfunction save(){ try { const o = {}; SAVE.forEach(i => o[i] = $(i).value); localStorage.setItem(\"l2s\", JSON.stringify(o)); } catch(e){} }\nfunction load(){ try { const o = JSON.parse(localStorage.getItem(\"l2s\") || \"{}\"); SAVE.forEach(i => { if (o[i] !== undefined) $(i).value = o[i]; }); } catch(e){} }\nconst DEFAULT_IDS = {cro:\"entry.288538840\",staff:\"entry.758514764\",emp:\"entry.2049282872\",doc:\"entry.1214780893\",codes:\"entry.683122914\",act:\"entry.1213937880\",bname:\"entry.862358152\",baddr:\"entry.1950886056\",tag:\"entry.2092637792\",notes:\"entry.1203880716\"};\nFIELDS.forEach(([k]) => { $(\"id-\" + k).value = DEFAULT_IDS[k]; });\nload();\nFIELDS.forEach(([k]) => { if (!$(\"id-\" + k).value.trim()) $(\"id-\" + k).value = DEFAULT_IDS[k]; });\nSAVE.forEach(i => $(i).addEventListener(\"input\", () => { save(); render(); }));\n$(\"lines\").addEventListener(\"input\", render);\nrender();\n<\/script>\n<script>\n(function(){\n  var c=document.getElementById(\"bgfx\"); if(!c) return;\n  var x=c.getContext(\"2d\"), root=document.documentElement;\n  var W=0,H=0,dpr=1,raf=0,light=false,last=0,D=[];\n  var FS=15, GAP=24, CH=\"01ABCDEF0123456789<>/#+\";\n  var reduce=window.matchMedia&&matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\n  function theme(){light=root.getAttribute(\"data-theme\")===\"light\";}\n  function rc(){return CH.charAt(Math.floor(Math.random()*CH.length));}\n  function reset(d,first){\n    d.len=8+Math.floor(Math.random()*14);\n    d.sp=40+Math.random()*80;\n    d.y=first?Math.random()*(H+d.len*FS):-Math.random()*H*.6;\n    d.ch=[]; for(var i=0;i<d.len;i++) d.ch.push(rc());\n  }\n  function size(){\n    dpr=Math.min(window.devicePixelRatio||1,2); W=innerWidth; H=innerHeight;\n    c.width=Math.round(W*dpr); c.height=Math.round(H*dpr); x.setTransform(dpr,0,0,dpr,0,0);\n    D=[]; var n=Math.ceil(W/GAP);\n    for(var i=0;i<n;i++){ if(Math.random()<.7){var d={x:i*GAP+6}; reset(d,true); D.push(d);} }\n  }\n  function frame(t){\n    var dt=Math.min(.05,(t-last)/1000||0); last=t;\n    x.clearRect(0,0,W,H);\n    x.font=FS+\"px ui-monospace,Menlo,Consolas,monospace\"; x.textBaseline=\"top\";\n    for(var k=0;k<D.length;k++){\n      var d=D[k];\n      if(!reduce){ d.y+=d.sp*dt; if(Math.random()<.04) d.ch[Math.floor(Math.random()*d.len)]=rc(); }\n      if(d.y-d.len*FS>H){ reset(d,false); }\n      var col;\n      if(light){ var m=d.x/W; col=\"rgb(\"+Math.round(59+80*m)+\",\"+Math.round(130-38*m)+\",246)\"; } else col=\"#fff\";\n      x.fillStyle=col;\n      for(var i=0;i<d.len;i++){\n        var cy=d.y-i*FS; if(cy<-FS||cy>H) continue;\n        var a=Math.pow(1-i/d.len,1.6)*(light?.5:.38);\n        x.globalAlpha=i===0?(light?.75:.6):a;\n        x.fillText(d.ch[i],d.x,cy);\n      }\n    }\n    x.globalAlpha=1;\n    if(!reduce) raf=requestAnimationFrame(frame);\n  }\n  function start(){cancelAnimationFrame(raf); last=performance.now(); raf=requestAnimationFrame(frame);}\n  theme(); size(); start();\n  addEventListener(\"resize\",function(){size(); if(reduce) start();});\n  document.addEventListener(\"visibilitychange\",function(){ if(document.hidden) cancelAnimationFrame(raf); else start(); });\n  new MutationObserver(function(){theme(); if(reduce) start();}).observe(root,{attributes:true,attributeFilter:[\"data-theme\"]});\n})();\n<\/script>\n<\/body>\n<\/html>\n";

<script>
(function(){
  // Google Sheet setup: paste your Apps Script Web app URL here (ends with /exec)
  var FORM_URL = "https://script.google.com/macros/s/AKfycbz5zNqg2ptjfkdyvKPPG4sHi9E276e5frspU4bYKzbsFB8kQwMu0oc6Azuicm8wqTtcrg/exec";
  var ENTRY_ID = "text";

  var m = document.getElementById("reqModal"),
      t = document.getElementById("reqText"),
      toast = document.getElementById("reqToast");
  function open(){ m.classList.add("open"); toast.textContent=""; t.focus(); }
  function close(){ m.classList.remove("open"); }
  document.getElementById("reqBtn").onclick = open;
  document.getElementById("reqClose").onclick = close;
  document.getElementById("lockBtn").addEventListener("click", close);
  m.addEventListener("click", function(e){ if(e.target===m) close(); });
  document.addEventListener("keydown", function(e){ if(e.key==="Escape") close(); });

  document.getElementById("reqSubmit").onclick = function(){
    var v = t.value.trim();
    if(!v){ toast.textContent = "Please type something first"; return; }
    if(FORM_URL.indexOf("PASTE_WEB_APP_URL") > -1){ toast.textContent = "Sheet link not set yet"; return; }
    if(v.length > 1500){ toast.textContent = "Too long (max 1500 characters)"; return; }
    var btn = document.getElementById("reqSubmit");
    btn.disabled = true; toast.textContent = "Sending...";
    var cb = "reqCb" + Date.now(), sc = document.createElement("script"), finished = false;
    function finish(msg, good){
      if(finished) return; finished = true;
      btn.disabled = false; toast.textContent = msg;
      try{ delete window[cb]; }catch(e){ window[cb] = undefined; }
      sc.remove();
      if(good){ t.value = ""; setTimeout(close, 1500); }
    }
    window[cb] = function(r){
      if(r && r.ok) finish("Submit successfully ✓", true);
      else finish("Sheet script error: " + ((r && r.error) || "unknown"), false);
    };
    sc.onerror = function(){ finish("Could not reach the sheet script. Check the web app URL and access.", false); };
    sc.src = FORM_URL + (FORM_URL.indexOf("?") > -1 ? "&" : "?") + "callback=" + cb + "&text=" + encodeURIComponent(v);
    document.body.appendChild(sc);
    setTimeout(function(){ finish("No reply from the script. Check the sheet, and redeploy the script.", false); }, 15000);
  };
})();
</script>
<script>
/* Animated background: digital rain. dark = white characters; light = blue/violet characters */
(function(){
  var c=document.getElementById("bgfx"); if(!c) return;
  var x=c.getContext("2d"), root=document.documentElement;
  var W=0,H=0,dpr=1,raf=0,light=false,last=0,D=[];
  var FS=15, GAP=24, CH="01ABCDEF0123456789<>/#+";
  var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  function theme(){light=root.getAttribute("data-theme")==="light";}
  function rc(){return CH.charAt(Math.floor(Math.random()*CH.length));}
  function reset(d,first){
    d.len=8+Math.floor(Math.random()*14);
    d.sp=40+Math.random()*80;
    d.y=first?Math.random()*(H+d.len*FS):-Math.random()*H*.6;
    d.ch=[]; for(var i=0;i<d.len;i++) d.ch.push(rc());
  }
  function size(){
    dpr=Math.min(window.devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
    c.width=Math.round(W*dpr); c.height=Math.round(H*dpr); x.setTransform(dpr,0,0,dpr,0,0);
    D=[]; var n=Math.ceil(W/GAP);
    for(var i=0;i<n;i++){ if(Math.random()<.7){var d={x:i*GAP+6}; reset(d,true); D.push(d);} }
  }
  function frame(t){
    var dt=Math.min(.05,(t-last)/1000||0); last=t;
    x.clearRect(0,0,W,H);
    x.font=FS+"px ui-monospace,Menlo,Consolas,monospace"; x.textBaseline="top";
    for(var k=0;k<D.length;k++){
      var d=D[k];
      if(!reduce){ d.y+=d.sp*dt; if(Math.random()<.04) d.ch[Math.floor(Math.random()*d.len)]=rc(); }
      if(d.y-d.len*FS>H){ reset(d,false); }
      var col;
      if(light){ var m=d.x/W; col="rgb("+Math.round(59+80*m)+","+Math.round(130-38*m)+",246)"; } else col="#fff";
      x.fillStyle=col;
      for(var i=0;i<d.len;i++){
        var cy=d.y-i*FS; if(cy<-FS||cy>H) continue;
        var a=Math.pow(1-i/d.len,1.6)*(light?.5:.38);
        x.globalAlpha=i===0?(light?.75:.6):a;
        x.fillText(d.ch[i],d.x,cy);
      }
    }
    x.globalAlpha=1;
    if(!reduce) raf=requestAnimationFrame(frame);
  }
  function start(){cancelAnimationFrame(raf); last=performance.now(); raf=requestAnimationFrame(frame);}
  theme(); size(); start();
  addEventListener("resize",function(){size(); if(reduce) start();});
  document.addEventListener("visibilitychange",function(){ if(document.hidden) cancelAnimationFrame(raf); else start(); });
  new MutationObserver(function(){theme(); if(reduce) start();}).observe(root,{attributes:true,attributeFilter:["data-theme"]});
})();
</script>
